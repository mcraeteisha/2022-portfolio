    <script>
      /* Set the theme before first paint. Without this, React applies
         data-theme in an effect and returning dark-mode visitors get a
         flash of the light theme. */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* Storage blocked — fall through to the prefers-color-scheme CSS. */
        }
      })();
    </script>
